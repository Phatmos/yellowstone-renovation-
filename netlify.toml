[dev]
  targetPort = 8000

[functions]
  directory = "netlify/functions"

# Consolidate legacy deck synonyms; keep campaign landing pages available.
[[redirects]]
  from = "/deck-builder"
  to = "/decking/"
  status = 301
  force = true

[[redirects]]
  from = "/deck-builder/"
  to = "/decking/"
  status = 301
  force = true

[[redirects]]
  from = "/deck-builder-near-me"
  to = "/decking/"
  status = 301
  force = true

[[redirects]]
  from = "/deck-builder-near-me/"
  to = "/decking/"
  status = 301
  force = true

[[redirects]]
  from = "/outdoor-decks/"
  to = "/outdoor-deck/"
  status = 301
  force = true

[[redirects]]
  from = "/deck-louisville/"
  to = "/cities/louisville-ky/deck-builder/"
  status = 301
  force = true

[[redirects]]
  from = "/siding/"
  to = "/siding-replacement/"
  status = 301

[[redirects]]
  from = "/projects"
  to = "/projects-showcase/"
  status = 301
  force = true

[[redirects]]
  from = "/projects/"
  to = "/projects-showcase/"
  status = 301
  force = true

[[redirects]]
  from = "/projects/frankfort-composite-deck/"
  to = "/projects/frankfort-ky-composite-deck/"
  status = 301
  force = true

[[redirects]]
  from = "/cities/midway-ky/"
  to = "/cities/"
  status = 301

[[redirects]]
  from = "/OurServices/"
  to = "/decking/"
  status = 301

[[redirects]]
  from = "/black-friday/"
  to = "/offers/"
  status = 301

[[redirects]]
  from = "/flooring/"
  to = "/decking/"
  status = 301

[[redirects]]
  from = "/fence-estimator1/"
  to = "/fence-estimator/"
  status = 301

[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/submit-lead"
  status = 200

[[redirects]]
  from = "/local-builder.html"
  to = "/local-builder/"
  status = 301
  force = true

# YouTube embeds must receive the site origin (Error 153 otherwise).
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
